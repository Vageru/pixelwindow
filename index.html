<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Піксельне вікно</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pixelify+Sans:400,600|VT323">
<style>
/* webOS 3.x (old Chromium): no clamp/min/max/env/gap/grid */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0b1026;color:#f5ecd8;overflow:hidden;font-family:'VT323','Courier New',monospace;font-size:20px}
#app{position:fixed;top:0;left:0;right:0;bottom:0}
#screen{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.hudtop{position:absolute;left:0;right:0;top:3vh;padding:0 5vw;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-start;align-items:flex-start;text-shadow:3px 3px 0 rgba(0,0,0,.55);pointer-events:none}
.clock{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:12vw;line-height:.9;letter-spacing:.02em}
.clock .dim{opacity:.25}
.mini .clock{font-size:4.6vw}
.mini .date{font-size:1.9vw}
#cAnalog{width:21vw;height:21vw;display:block}
.flip{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:9vw}
.tile{position:relative;width:.72em;margin-right:.08em;text-align:center;line-height:1.18;background:#141428;border:3px solid #3d3866;text-shadow:none}
.tile:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(0,0,0,.55)}
.tile.go{-webkit-animation:flip .32s steps(4);animation:flip .32s steps(4)}
.flip .sep{width:.3em;margin-right:.08em;text-align:center}
@-webkit-keyframes flip{0%{-webkit-transform:scaleY(1)}50%{-webkit-transform:scaleY(.06)}100%{-webkit-transform:scaleY(1)}}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.06)}100%{transform:scaleY(1)}}
.date{font-size:2.6vw;color:#c4bdd6;margin-top:.35em}
.weather{text-align:right}
.temp{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:6.6vw;line-height:.95}
.wdesc{font-size:2.4vw}
.wplace{font-size:1.6vw;color:#c4bdd6}
.barwrap{position:absolute;left:0;right:0;bottom:3vh;padding:0 5vw;-webkit-transition:opacity .7s;transition:opacity .7s}
.barwrap.hide{opacity:0}
.bar{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;background:rgba(9,10,24,.74);border:2px solid #3d3866;padding:.5vw 1vw;font-size:1.8vw}
.bar > *{margin-right:1vw}
.theme{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.theme > *{margin-right:.6vw}
#themeName{min-width:8.5em;text-align:center}
button{font:inherit;color:#f5ecd8;background:transparent;border:2px solid #3d3866;padding:1px 10px;line-height:1.2}
button.on{border-color:#ffcf6b;color:#ffcf6b}
.keys{color:#c4bdd6;margin-left:auto}
.menuwrap{position:absolute;top:3vh;right:5vw;bottom:17vh;width:42vw}
.menu{background:rgba(9,10,24,.93);border:2px solid #3d3866;padding:1vw 1.2vw;font-size:1.6vw;max-height:100%;overflow-y:auto;box-sizing:border-box}
.menu h2{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:1.25em;margin:0 0 4px}
.menu .hint{color:#c4bdd6;margin:0 0 .6vw;font-size:.85em}
.menu .group{color:#c4bdd6;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;margin:.6vw 6px 2px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:2px 6px;border:2px solid transparent}
.row.focus{border-color:#ffcf6b}
.row > span:first-child{width:1.3em;-webkit-flex:none;flex:none}
.row .dot{display:inline-block;width:.7em;height:.7em;border:2px solid #c4bdd6;box-sizing:border-box}
.row.active .dot{background:#ffcf6b;border-color:#ffcf6b}
.row.active .label{color:#ffcf6b}
.row .label{-webkit-flex:1;flex:1;min-width:0}
.row .sub{display:block;color:#c4bdd6;font-size:.8em}
.row.child{padding-left:2em}
.vol,.pick{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.vol > *,.pick > *{margin-left:6px}
.vol button,.pick button{padding:0 7px}
.pick span{min-width:7em;text-align:center}
.meter{display:-webkit-flex;display:flex}
.meter i{display:block;width:6px;height:14px;margin-right:2px;background:#3d3866}
.meter i.f{background:#f5ecd8}

#fs{display:none}
.menu #srcNote{margin:.6vw 0 0}
</style></head><body>
<div id="app">
  <canvas id="screen"></canvas>
  <div class="hudtop">
    <div id="clockwrap">
      <div class="clock" id="cDigital"><span id="hh">18</span><span id="colon">:</span><span id="mm">30</span></div>
      <canvas id="cAnalog" width="280" height="280" hidden></canvas>
      <div class="flip" id="cFlip" hidden><span class="tile" id="f0">1</span><span class="tile" id="f1">8</span><span class="sep">:</span><span class="tile" id="f2">3</span><span class="tile" id="f3">0</span></div>

  </div>
  <div class="menuwrap" id="menuwrap" hidden>
    <div class="menu" role="dialog" aria-label="Звуки">
      <h2>Звуки</h2>
      <p class="hint">Пульт: ▲▼ вибір · ◀▶ гучність або стиль · OK увімк./вимк. · «Назад» закрити</p>
      <div id="rows"></div>
      <p class="hint" id="srcNote" hidden></p>
    </div>
  </div>
  <div class="barwrap" id="barwrap">
    <div class="bar">
      <div class="theme">
        <button id="prev" aria-label="Попередня сцена">◀</button>

      <span class="keys">Пульт: ◀ ▶ сцена · ▲ звуки · ▼ годинник · OK музика · червона — світло</span>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var W=192,H=108;
var screen=document.getElementById('screen');
var sctx=screen.getContext('2d');
var buf=document.createElement('canvas');buf.width=W;buf.height=H;
var b=buf.getContext('2d');
function $(id){return document.getElementById(id);}
function mk(){var c=document.createElement('canvas');c.width=W;c.height=H;return c;}
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function px(g,x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1);}
function circle(g,cx,cy,r,c){for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++)if(x*x+y*y<=r*r)px(g,cx+x,cy+y,c);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function load(k,def){try{var v=localStorage.getItem(k);return v===null?def:JSON.parse(v);}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var weather={temp:-2,desc:'легкий сніг',precip:'snow',live:false};
var fx={flash:0,puff:0,horse:0};

/* =================== SKY: light follows the real sun over Vinnytsia =================== */
var Sky=(function(){
  var LAT=49.23,LON=28.47,rad=Math.PI/180;
  var P={
    N:['#0b1026','#10183a','#17204a','#202a5a','#2c3468'],
    BLUE:['#151d48','#222c64','#34407e','#4f5592','#7a6a9a'],
    SUNSET:['#283672','#4a5596','#93679a','#e0866a','#f6b86a'],
    DAWN:['#2b3a7a','#56609e','#a97aa8','#ee9fa0','#f8cba4'],
    GOLD:['#3f78c0','#5f93d0','#86ade0','#c0c8d8','#f2d6a8'],
    MORN:['#4682cc','#68a0dc','#8fbae6','#b9d3ee','#e6e4dc'],
    DAY:['#3a82d6','#5799e0','#78afe8','#99c4ee','#bfdbf4']
  };
  var K=[
    {e:-90,pm:P.N,am:P.N,s:1,tc:'#5866b0',ta:0,w:1,l:1},
    {e:-12,pm:P.N,am:P.N,s:1,tc:'#5866b0',ta:0,w:1,l:1},
    {e:-6,pm:P.BLUE,am:P.BLUE,s:.45,tc:'#5866b0',ta:.06,w:.9,l:1},
    {e:-1,pm:P.SUNSET,am:P.DAWN,s:0,tc:'#ff9a6a',ta:.12,w:.6,l:.7},
    {e:6,pm:P.GOLD,am:P.MORN,s:0,tc:'#ffd8b0',ta:.22,w:.1,l:0},
    {e:12,pm:P.DAY,am:P.DAY,s:0,tc:'#d2e6ff',ta:.3,w:0,l:0},
    {e:20,pm:P.DAY,am:P.DAY,s:0,tc:'#d2e6ff',ta:.32,w:0,l:0},
    {e:91,pm:P.DAY,am:P.DAY,s:0,tc:'#d2e6ff',ta:.32,w:0,l:0}
  ];
  var MODES=[{id:'auto',name:'авто'},{id:'dawn',name:'ранок',el:1,ha:-1.35},{id:'day',name:'день',el:24,ha:-.25},{id:'dusk',name:'захід',el:-1,ha:1.35},{id:'night',name:'ніч',el:-30,ha:3}];
  var mode=load('pixeltv-light',0);if(!(mode>=0&&mode<MODES.length))mode=0;
  function hx(c){return[parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
  function mix(a,c,f){var x=hx(a),y=hx(c),o='#',k,v;for(k=0;k<3;k++){v=Math.round(x[k]+(y[k]-x[k])*f).toString(16);o+=v.length<2?'0'+v:v;}return o;}
  function sun(d){
    var n=d.getTime()/86400000+2440587.5-2451545.0;
    var L=(280.460+0.9856474*n)%360,g=((357.528+0.9856003*n)%360)*rad;
    var lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,eps=(23.439-0.0000004*n)*rad;
    var dec=Math.asin(Math.sin(eps)*Math.sin(lam)),ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
    var gmst=(280.46061837+360.98564736629*n)%360,ha=(gmst+LON)*rad-ra;
    var el=Math.asin(Math.sin(LAT*rad)*Math.sin(dec)+Math.cos(LAT*rad)*Math.cos(dec)*Math.cos(ha))/rad;
    return{el:el,ha:ha};
  }
  var S={};
  function update(){
    var el,ha,m=MODES[mode];
    if(m.id==='auto'){var r=sun(new Date());el=r.el;ha=r.ha;}else{el=m.el;ha=m.ha;}
    var am=Math.sin(ha)<0,k=0;while(k<K.length-2&&el>=K[k+1].e)k++;
    var A=K[k],B=K[k+1],f=Math.max(0,Math.min(1,(el-A.e)/(B.e-A.e))),pa=am?A.am:A.pm,pb=am?B.am:B.pm,i;
    S.pal=[];for(i=0;i<5;i++)S.pal.push(mix(pa[i],pb[i],f));
    S.stars=A.s+(B.s-A.s)*f;S.tc=mix(A.tc,B.tc,f);S.ta=A.ta+(B.ta-A.ta)*f;S.win=A.w+(B.w-A.w)*f;S.lamps=A.l+(B.l-A.l)*f;
    S.el=el;var hn=Math.atan2(Math.sin(ha),Math.cos(ha));S.sunX=96+hn/(Math.PI/2)*80;S.sunY=74-el*1.9;
    S.day=Math.max(0,Math.min(1,(el+4)/14));S.key=S.pal.join('')+S.tc+S.ta.toFixed(2);
  }
  update();setInterval(update,30000);
  S.drawSky=function(g,x0,y0,w,h){var bh=h/5,i,x,yy;
    for(i=0;i<5;i++){yy=y0+Math.round(i*bh);rect(g,x0,yy,w,Math.ceil(bh)+1,S.pal[i]);
      if(i>0)for(x=x0;x<x0+w;x+=2){px(g,x,yy,S.pal[i-1]);px(g,x+1,yy+1,S.pal[i-1]);}}};
  S.drawSun=function(g){
    if(S.el>-4){var cy=Math.max(9,S.sunY),c=S.el<4?'#ffb070':'#fff1b8';
      if(S.el>2){g.globalAlpha=.25;circle(g,S.sunX,cy,8,'#fff6d0');g.globalAlpha=1;}
      circle(g,S.sunX,cy,5,c);}
    var ma=Math.max(0,Math.min(1,(-S.el-3)/6));
    if(ma>0){g.globalAlpha=ma;circle(g,156,18,7,'#f1e4b3');px(g,153,16,'#d9c98f');px(g,154,16,'#d9c98f');px(g,158,21,'#d9c98f');px(g,159,15,'#d9c98f');g.globalAlpha=1;}
  };
  S.tinted=function(layer,cache){
    if(cache.key!==S.key){if(!cache.c)cache.c=mk();var g=cache.c.getContext('2d');g.clearRect(0,0,W,H);g.drawImage(layer,0,0);
      if(S.ta>0){g.globalCompositeOperation='source-atop';g.globalAlpha=S.ta;g.fillStyle=S.tc;g.fillRect(0,0,W,H);g.globalAlpha=1;g.globalCompositeOperation='source-over';}
      cache.key=S.key;}
    return cache.c;
  };
  S.setMode=function(i){mode=(i+MODES.length)%MODES.length;save('pixeltv-light',mode);update();};
  S.modeName=function(){return MODES[mode].name;};
  return S;
})();

/* =================== GENERATED MUSIC: 4 styles =================== */
var STATIONS=[{id:'lofi',name:'Спокійний lo-fi'},{id:'jazz',name:'Нічний джаз'},{id:'ambient',name:'Ембієнт'},{id:'chip',name:'8-біт'},{id:'medieval',name:'Середньовіччя'}];
var Music=(function(){
  var ctx,out,filt,crk,noise,send,timer=null,nextTime=0,step=0,station=load('pixeltv-station',0);
  if(!(station>=0&&station<STATIONS.length))station=0;
  function mtof(m){return 440*Math.pow(2,(m-69)/12);}
  function env(g,t,p,a,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
  function osc(type,m,t,d,v,a,dest,det){var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=mtof(m)*(det||1);o.connect(g);g.connect(dest||filt);env(g,t,v,a||.012,d);o.start(t);o.stop(t+d+.05);return g;}
  function keys(m,t,d,v){var g=osc('sine',m,t,d,v);var g2=osc('triangle',m+12,t,d,v*.18,.012,filt,1.003);return g;}
  function nz(t,type,f,v,d,dest){var s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;fl.type=type;fl.frequency.value=f;s.connect(fl);fl.connect(g);g.connect(dest||out);env(g,t,v,.004,d);s.start(t,Math.random()*.5);s.stop(t+d+.05);}
  function kick(t,v){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);o.connect(g);g.connect(out);env(g,t,v||.55,.005,.26);o.start(t);o.stop(t+.3);}
  function pick(a){return a[(Math.random()*a.length)|0];}
  function pluck(m,t,d,v){osc('triangle',m,t,d,v,.004);osc('sine',m+12,t,d*.6,v*.25,.004);osc('triangle',m,t,d,v*.35,.004,send);}
  var mot=null,MOT=[[7,9,8,7,5,7,4,null],[7,null,9,11,9,8,7,null],[8,7,5,4,5,7,null,null],[9,8,7,8,5,4,3,null],[7,11,9,7,8,5,4,null]];
  var DEG=[50,52,53,55,57,59,60,62,64,65,67,69,71,72,74],MROOT=[38,36,38,43];
  var ST={
    lofi:{sd:60/72/2,play:function(s,t,sd){
      var CH=[[55,58,62,65],[52,55,58,62],[53,57,60,64],[50,53,57,60]],BS=[43,48,41,38];
      var bar=Math.floor(s/8)%4,pos=s%8,tt=t+(pos%2?sd*.2:0),i;
      if(pos===0){for(i=0;i<4;i++)keys(CH[bar][i],tt,sd*7,.06);osc('sine',BS[bar],tt,sd*3.5,.32);}
      if(pos===5)osc('sine',BS[bar]+7,tt,sd*2,.32);
      if(pos===6&&Math.random()<.45)for(i=1;i<4;i++)keys(CH[bar][i],tt,sd*2,.035);
      if(pos===0||pos===4||(pos===7&&Math.random()<.25))kick(tt);
      if(pos===2||pos===6)nz(tt,'bandpass',1800,.11,.16);
      nz(tt,'highpass',7000,pos%2?.018:.032,.045);
      if((pos===1||pos===3||pos===4||pos===7)&&Math.random()<.32)keys(pick([65,67,69,72,74,77,79]),tt,sd*2.5,.05);
    }},
    jazz:{sd:60/96/2,play:function(s,t,sd){
      var CH=[[53,57,60,64],[53,57,59,64],[52,55,59,62],[55,58,61,64]],BS=[38,43,36,45];
      var bar=Math.floor(s/8)%4,pos=s%8,tt=t+(pos%2?sd*.33:0),nb=BS[(bar+1)%4],i;
      if(pos%2===0){var q=pos/2,n=q===0?BS[bar]:q===1?BS[bar]+pick([3,4,5]):q===2?BS[bar]+7:nb+pick([-1,1]);
        osc('triangle',n,tt,sd*1.6,.3);osc('sine',n,tt,sd*1.6,.18);}
      if(pos===0||pos===2||pos===3||pos===4||pos===6||pos===7)nz(tt,'highpass',6500,pos===3||pos===7?.022:.034,.28);
      if(pos===2||pos===6)nz(tt,'bandpass',2600,.05,.22);
      if((pos===3||pos===5||(pos===0&&Math.random()<.4))&&Math.random()<.7)for(i=0;i<4;i++)keys(CH[bar][i],tt,sd*1.3,.045);
      if(pos%2===1&&Math.random()<.3){var g=keys(pick([62,65,67,69,72,74,76]),tt,sd*2,.05);}
    }},
    ambient:{sd:60/50/2,play:function(s,t,sd){
      var CH=[[53,57,60,64,67],[57,60,64,67],[58,62,65,69],[60,65,67,72]];
      var ch=Math.floor(s/16)%4,pos=s%16,i;
      if(pos===0){var d=sd*16+2.5;
        for(i=0;i<CH[ch].length;i++){var g1=osc('sawtooth',CH[ch][i],t,d,.022,2.2,pad),g2=osc('sawtooth',CH[ch][i],t,d,.022,2.2,pad,1.006);}
        osc('sine',CH[ch][0]-24,t,d,.16,2.5);}
      if(Math.random()<.2){var m=pick([72,74,76,79,81,84]);osc('sine',m,t,3,.05,.01,send);osc('sine',m+12,t,1.5,.012,.01,send);}
    }},
    chip:{sd:60/116/4,play:function(s,t,sd){
      var CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
      var bar=Math.floor(s/16)%4,pos=s%16,c=CH[bar];
      osc('square',c[pos%3]+12*((pos>>2)%2)+12,t,sd*.9,.022,.002);
      if(pos%4===0)osc('triangle',c[0]-12,t,sd*3,.22,.004);
      if(pos%4===2)osc('triangle',c[0]-12+7,t,sd*1.5,.18,.004);
      if(pos===0||pos===8||(pos===10&&Math.random()<.5)){var o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(50,t+.1);o.connect(g);g.connect(out);env(g,t,.4,.003,.14);o.start(t);o.stop(t+.2);}
      if(pos===4||pos===12)nz(t,'bandpass',2200,.1,.1);
      if(pos%2===1)nz(t,'highpass',8000,.02,.03);
      if(pos%4===0&&Math.random()<.45)osc('square',pick([69,72,74,76,79,81]),t,sd*3.5,.03,.002,send);
    }},
    medieval:{sd:60/76/2,play:function(s,t,sd){
      var bar=Math.floor(s/16)%4,pos=s%16,root=MROOT[bar],q=pos>>1,m;
      if(pos===0){
        if(!mot||Math.random()<.6)mot=pick(MOT);
        osc('sine',root,t,sd*16,.17,.5);osc('sine',root+7,t,sd*16,.07,.9);osc('triangle',root+12,t,sd*16,.025,.9);
        pluck(root+12,t,sd*5,.08);
      }
      if(pos===8)pluck(root+19,t,sd*5,.07);
      if(pos%2===0){m=mot[q];if(m!==null&&m!==undefined)pluck(DEG[m],t,sd*3.2,.1);}
      if(pos===0||pos===8)kick(t,.17);
      if(pos===4||pos===12)nz(t,'bandpass',1500,.05,.07);
    }}
  };
  var pad;
  function init(c,dest){

    storm:function(o){chain([loop(white),flt('highpass',350),flt('lowpass',3400),gain(.38),o]);chain([loop(brown),flt('lowpass',500),gain(.6),o]);},

/* =================== PRECIPITATION =================== */
function Precip(n,x0,y0,x1,y1,seed){
  var r=rng(seed),p=[],i;
  for(i=0;i<n;i++)p.push({x:x0+r()*(x1-x0),y:y0+r()*(y1-y0),s:.6+r()*.8,o:r()*6.28});
  this.p=p;this.x0=x0;this.y0=y0;this.x1=x1;this.y1=y1;
}
Precip.prototype.draw=function(g,dt,t,type,snowC,rainC){
  if(!type)return;
  var p=this.p,i,q,w=this.x1-this.x0,h=this.y1-this.y0,heavy=Snd.isOn('storm');
  for(i=0;i<p.length;i++){
    if(type==='rain'&&!heavy&&i%3===2)continue;
    q=p[i];
    if(type==='snow'){q.y+=dt*7*q.s;q.x+=Math.sin(t*1.2+q.o)*dt*3;}
    else{q.y+=dt*(heavy?95:70)*q.s;q.x-=dt*(heavy?20:12)*q.s;}
    if(q.y>this.y1)q.y-=h;
    if(q.x<this.x0)q.x+=w;if(q.x>this.x1)q.x-=w;
    if(type==='snow')px(g,q.x,q.y,snowC);
    else{px(g,q.x,q.y,rainC);px(g,q.x+1,q.y-1,rainC);px(g,q.x+2,q.y-2,rainC);}
  }
};

var ac=$('cAnalog').getContext('2d');var AS=$('cAnalog').width/56;if(AS!==1)ac.scale(AS,AS);
function pad(n){return n<10?'0'+n:''+n;}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
  for(;;){px(g,x0,y0,c);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function drawAnalog(d){
  var g=ac,cx=28,cy=28,x,y,i;g.clearRect(0,0,56,56);
  for(y=0;y<56;y++)for(x=0;x<56;x++){var dd=(x-cx+.5)*(x-cx+.5)+(y-cy+.5)*(y-cy+.5);
    if(dd<=24*24)px(g,x,y,'rgba(10,11,28,0.72)');else if(dd<=26.5*26.5)px(g,x,y,'#f5ecd8');}
  for(i=0;i<12;i++){var a=i/12*Math.PI*2,mx=cx+Math.sin(a)*20.5,my=cy-Math.cos(a)*20.5;
    if(i%3===0)rect(g,mx-1,my-1,2,2,'#ffcf6b');else px(g,mx,my,'#c4bdd6');}
  var h=d.getHours()%12+d.getMinutes()/60,m=d.getMinutes()+d.getSeconds()/60,s=d.getSeconds();
  function hand(frac,len,c,thick){var a=frac*Math.PI*2,ex=cx+Math.sin(a)*len,ey=cy-Math.cos(a)*len;line(g,cx,cy,ex,ey,c);if(thick)line(g,cx-1,cy,ex-1,ey,c);}
  hand(h/12,11,'#f5ecd8',true);hand(m/60,17,'#f5ecd8',false);hand(s/60,19,'#ff8a5c',false);
  rect(g,cx-1,cy-1,2,2,'#ffcf6b');
}
var flipPrev='';
function tick(){
  var d=new Date(),st=STYLES[cstyle].id,hh=pad(d.getHours()),mm=pad(d.getMinutes());
  $('cDigital').hidden=!(st==='digital'||st==='mini');$('cAnalog').hidden=st!=='analog';$('cFlip').hidden=st!=='flip';
  $('clockwrap').className=st==='mini'?'mini':'';
  $('hh').textContent=hh;$('mm').textContent=mm;$('colon').className=d.getSeconds()%2?'dim':'';
  if(st==='analog')drawAnalog(d);
  if(st==='flip'){var s=hh+mm;for(var i=0;i<4;i++){var el=$('f'+i),c=s.charAt(i);if(el.textContent!==c||flipPrev===''){el.textContent=c;el.className='tile';void el.offsetWidth;if(flipPrev!=='')el.className='tile go';}}flipPrev=s;}
  $('date').textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}
function setClock(i){cstyle=(i+STYLES.length)%STYLES.length;save('pixeltv-clock',cstyle);$('clockBtn').textContent='Годинник: '+STYLES[cstyle].name;flipPrev='';tick();}
setClock(cstyle);setInterval(tick,1000);

/* =================== WEATHER (Open-Meteo, Вінниця) =================== */
function codeInfo(c){
  if(c===0)return['ясно',null];if(c<=2)return['мінлива хмарність',null];if(c===3)return['хмарно',null];
  if(c===45||c===48)return['туман',null];if(c>=51&&c<=57)return['мряка','rain'];if(c>=61&&c<=67)return['дощ','rain'];
  if(c>=71&&c<=77)return['сніг','snow'];if(c>=80&&c<=82)return['злива','rain'];if(c===85||c===86)return['снігопад','snow'];
  if(c>=95)return['гроза','rain'];return['—',null];
}
function showWeather(){
  var tv=Math.round(weather.temp);
  $('temp').textContent=(tv<0?'−'+(-tv):(tv>0?'+'+tv:'0'))+'°';$('wdesc').textContent=weather.desc;
  var d=new Date();$('wplace').textContent=weather.live?'Вінниця · оновлено '+pad(d.getHours())+':'+pad(d.getMinutes()):'Вінниця · приклад погоди';
}
function loadWeather(){
  try{var x=new XMLHttpRequest();
    x.open('GET',(loadWeather.http?'http':'https')+'://api.open-meteo.com/v1/forecast?latitude=49.23&longitude=28.47&current=temperature_2m,weather_code&timezone=auto');
    x.timeout=7000;
    x.onerror=x.ontimeout=function(){if(!loadWeather.http){loadWeather.http=true;loadWeather();}};
    x.onload=function(){try{var j=JSON.parse(x.responseText),c=j.current,info=codeInfo(c.weather_code);weather.temp=c.temperature_2m;weather.desc=info[0];weather.precip=info[1];weather.live=true;showWeather();}catch(e){}};
    x.send();}catch(e){}
}
showWeather();loadWeather();setInterval(loadWeather,20*60*1000);

/* =================== SOUND MENU =================== */
var focusIdx=0;
function menuItems(){
  var a=[{kind:'preset',label:'Увімкнути звуки сцени «'+scenes[cur].name+'»'}];
  a.push({kind:'group',label:'Музика'});
  a.push({kind:'ch',id:'music',label:'Генерована музика'});
  a.push({kind:'station',label:'Стиль'});
  a.push({kind:'stream',label:'Lo-fi радіо онлайн'});
  a.push({kind:'group',label:'Атмосфера'});
  for(var i=1;i<Snd.defs.length;i++)a.push({kind:'ch',id:Snd.defs[i].id,label:Snd.defs[i].name});
  a.push({kind:'off',label:'Вимкнути всі звуки'});
  a.push({kind:'close',label:'Закрити'});
  return a;
}
function selectable(it){return it.kind!=='group';}
function renderMenu(){
  var items=menuItems(),html='',i,it,v,k,m;
  if(!selectable(items[focusIdx]))focusIdx++;
  for(i=0;i<items.length;i++){it=items[i];var fc=i===focusIdx?' focus':'';
    if(it.kind==='group'){html+='<div class="group">'+it.label+'</div>';continue;}
    if(it.kind==='ch'){
      v=Snd.vol(it.id);m='';for(k=1;k<=10;k++)m+='<i class="'+(k<=Math.round(v*10)?'f':'')+'"></i>';
      html+='<div class="row'+(Snd.isOn(it.id)?' active':'')+fc+'" data-i="'+i+'"><span class="dot"></span><span class="label">'+it.label+'</span>'+
        '<span class="vol"><button data-d="-1" data-i="'+i+'" aria-label="Тихіше">−</button><span class="meter">'+m+'</span><button data-d="1" data-i="'+i+'" aria-label="Гучніше">+</button></span></div>';
    }else if(it.kind==='station'){
      html+='<div class="row child'+fc+'" data-i="'+i+'"><span></span><span class="label">Стиль</span>'+
        '<span class="pick"><button data-p="-1" data-i="'+i+'" aria-label="Попередній стиль">◀</button><span>'+STATIONS[Music.station()].name+'</span><button data-p="1" data-i="'+i+'" aria-label="Наступний стиль">▶</button></span></div>';
    }else if(it.kind==='stream'){
      var sObj=Stream.list[Stream.idx()],stat=Stream.status();
      html+='<div class="row'+(Stream.isOn()?' active':'')+fc+'" data-i="'+i+'"><span class="dot"></span><span class="label">'+it.label+
        '<span class="sub">'+(stat?stat:sObj.sub+' · гучність як у музики')+'</span></span>'+
        '<span class="pick"><button data-p="-1" data-i="'+i+'" aria-label="Попередня станція">◀</button><span>'+sObj.name+'</span><button data-p="1" data-i="'+i+'" aria-label="Наступна станція">▶</button></span></div>';
    }else html+='<div class="row wide'+fc+'" data-i="'+i+'"><span>'+(it.kind==='close'?'×':it.kind==='off'?'■':'▶')+'</span><span class="label">'+it.label+'</span></div>';
  }
  $('rows').innerHTML=html;
  var f=$('rows').querySelector('.focus'),mb=document.querySelector('.menu');
  if(f&&mb){if(focusIdx<=1)mb.scrollTop=0;else{var fr=f.getBoundingClientRect(),mr=mb.getBoundingClientRect();
    if(fr.top<mr.top+12)mb.scrollTop-=mr.top+12-fr.top;else if(fr.bottom>mr.bottom-12)mb.scrollTop+=fr.bottom-(mr.bottom-12);}}
}
Stream.onChange(function(){if(menuOpen)renderMenu();});
function activate(i){
  var it=menuItems()[i];if(!it)return;
  if(it.kind==='ch')Snd.toggle(it.id);
  else if(it.kind==='station')Snd.toggle('music');
  else if(it.kind==='stream'){Snd.unlock();Stream.toggle();}
  else if(it.kind==='preset'){Stream.off();var p=scenes[cur].preset;for(var k=0;k<Snd.defs.length;k++){var id=Snd.defs[k].id;Snd.set(id,p.indexOf(id)>=0);}}
  else if(it.kind==='off'){Stream.off();for(var j=0;j<Snd.defs.length;j++)Snd.set(Snd.defs[j].id,false);}
  else if(it.kind==='close'){openMenu(false);return;}
  renderMenu();
}
function sideways(i,d){
  var it=menuItems()[i];
  if(it.kind==='ch'){Snd.nudge(it.id,d*.1);if(!Snd.isOn(it.id)&&d>0)Snd.set(it.id,true);}
  else if(it.kind==='station')Music.setStation(Music.station()+d);
  else if(it.kind==='stream')Stream.move(d);
  renderMenu();
}
function openMenu(o){menuOpen=o;$('menuwrap').hidden=!o;$('soundsBtn').className=o?'on':'';if(o){focusIdx=0;renderMenu();}}
$('rows').addEventListener('click',function(e){
  var el=e.target;while(el&&el!==this&&!el.getAttribute('data-i'))el=el.parentNode;if(!el||el===this)return;
  var i=parseInt(el.getAttribute('data-i'),10),d=el.getAttribute('data-d'),p=el.getAttribute('data-p');focusIdx=i;Snd.unlock();
  if(d)sideways(i,parseInt(d,10));else if(p)sideways(i,parseInt(p,10));else activate(i);
});

/* =================== CONTROLS =================== */
var barwrap=$('barwrap'),hideT;
function wake(){barwrap.className='barwrap';clearTimeout(hideT);hideT=setTimeout(function(){if(!menuOpen)barwrap.className='barwrap hide';},9000);}
wake();
function lightLabel(){$('lightBtn').textContent='Світло: '+Sky.modeName();}
lightLabel();
$('prev').addEventListener('click',function(){setScene(cur-1);wake();});
$('next').addEventListener('click',function(){setScene(cur+1);wake();});
$('soundsBtn').addEventListener('click',function(){Snd.unlock();openMenu(!menuOpen);wake();});
$('clockBtn').addEventListener('click',function(){setClock(cstyle+1);wake();});
var lightIdx=0;
(function(){var names=['авто','ранок','день','захід','ніч'];for(var k=0;k<names.length;k++)if(names[k]===Sky.modeName())lightIdx=k;})();
$('lightBtn').onclick=function(){lightIdx=(lightIdx+1)%5;Sky.setMode(lightIdx);lightLabel();wake();};
$('fs').addEventListener('click',function(){var el=document.documentElement;try{var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(function(){});}catch(e){}});
document.addEventListener('mousemove',wake);
document.addEventListener('pointerdown',function(){Snd.unlock();});
document.addEventListener('keydown',function(e){
  var k=e.keyCode,tag=document.activeElement&&document.activeElement.tagName;wake();Snd.unlock();
  if(menuOpen){
    var items=menuItems(),n=items.length;
    if(k===38){do{focusIdx=(focusIdx-1+n)%n;}while(!selectable(items[focusIdx]));renderMenu();}
    else if(k===40){do{focusIdx=(focusIdx+1)%n;}while(!selectable(items[focusIdx]));renderMenu();}
    else if(k===37||k===39){sideways(focusIdx,k===39?1:-1);}
    else if(k===13||k===32){if(tag==='BUTTON')return;activate(focusIdx);}
    else if(k===27||k===461||k===8){openMenu(false);}
    else return;
    e.preventDefault();return;
  }
  if(k===403){lightIdx=(lightIdx+1)%5;Sky.setMode(lightIdx);lightLabel();e.preventDefault();return;}
  if(k===404){setClock(cstyle+1);e.preventDefault();return;}
  if(k===406){openMenu(true);e.preventDefault();return;}
  if(k===37)setScene(cur-1);
  else if(k===39)setScene(cur+1);
  else if(k===38)openMenu(true);
  else if(k===40)setClock(cstyle+1);
  else if(k===13||k===32){if(tag==='BUTTON')return;if(Stream.isOn())Stream.toggle();else Snd.toggle('music');}
  else return;
  e.preventDefault();
});
if(window.__src){$('srcNote').hidden=false;$('srcNote').textContent='Версія: '+window.__src;}
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
})();
</script>
